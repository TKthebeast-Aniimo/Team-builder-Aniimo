<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Aniimo Team Builder</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">
    <div>
        <h1>⚔️ Aniimo Team Builder</h1>
        <p>Build teams. Find synergies. Discover weaknesses.</p>
    </div>
</header>

<main class="container">

    <!-- TEAM -->

    <section class="panel">

        <h2>Your Team</h2>

        <p class="help">
            Choose an Aniimo for each slot. You can use any combination
            of DPS, Support, Regen, Break and Heal.
        </p>

        <div id="teamSlots" class="team-slots">

            <button class="team-slot empty" data-slot="0">
                <span class="slot-number">1</span>
                <span class="slot-text">Select Aniimo</span>
            </button>

            <button class="team-slot empty" data-slot="1">
                <span class="slot-number">2</span>
                <span class="slot-text">Select Aniimo</span>
            </button>

            <button class="team-slot empty" data-slot="2">
                <span class="slot-number">3</span>
                <span class="slot-text">Select Aniimo</span>
            </button>

            <button class="team-slot empty" data-slot="3">
                <span class="slot-number">4</span>
                <span class="slot-text">Select Aniimo</span>
            </button>

        </div>

        <button id="clearTeam" class="danger-button">
            Clear Team
        </button>

    </section>


    <!-- TEAM ANALYSIS -->

    <section class="panel">

        <h2>Team Analysis</h2>

        <div id="analysis">

            <div class="empty-analysis">
                Select Aniimo to begin building your team.
            </div>

        </div>

    </section>


    <!-- FILTERS -->

    <section class="panel">

        <h2>Aniimo Roster</h2>

        <div class="controls">

            <input
                id="searchInput"
                type="search"
                placeholder="Search Aniimo..."
            >

            <select id="elementFilter">

                <option value="all">
                    All Elements
                </option>

                <option value="fire">🔥 Fire</option>
                <option value="water">💧 Water</option>
                <option value="grass">🌿 Grass</option>
                <option value="ice">❄️ Ice</option>
                <option value="electric">⚡ Electric</option>
                <option value="wind">🌪️ Wind</option>
                <option value="rock">🪨 Rock</option>
                <option value="dark">🌑 Dark</option>
                <option value="holy">✨ Holy</option>

            </select>

        </div>


        <div id="roleFilters" class="role-filters">

            <button class="role-button active" data-role="all">
                All
            </button>

            <button class="role-button" data-role="DPS">
                DPS
            </button>

            <button class="role-button" data-role="Support">
                Support
            </button>

            <button class="role-button" data-role="REGEN">
                Regen
            </button>

            <button class="role-button" data-role="BREAK">
                Break
            </button>

            <button class="role-button" data-role="Heal">
                Heal
            </button>

        </div>

        <div id="rosterStatus" class="status">
            Loading roster...
        </div>

        <div id="roster" class="roster"></div>

    </section>


    <!-- DETAILS -->

    <section
        id="detailsPanel"
        class="panel hidden"
    >

        <div id="details"></div>

    </section>

</main>

<script src="app.js"></script>

</body>
</html>
